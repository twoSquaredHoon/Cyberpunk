<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psycho Cam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the camera fills the screen untouched; one slim control rail along the bottom */
:root{
  --void:#0d0812;
  --panel:#1a1022e0;
  --pink:#ff3d8b;
  --cyan:#5ef2ff;
  --ink:#f4e9ff;
  --dim:#a48fb8;
  --display:"Chakra Petch", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--display);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#out{width:100%;height:100%;object-fit:contain;display:block}
video{display:none}

#rail{position:fixed;left:0;right:0;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center}
button{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid #ffffff2a;padding:10px 14px;cursor:pointer;touch-action:none}
button[aria-pressed="true"]{background:var(--pink);color:#160812;border-color:var(--pink)}
button:hover{border-color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#trigger{border-color:var(--pink);color:var(--pink)}
#trigger.on{background:var(--pink);color:#160812}
label.sl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
input[type=range]{accent-color:var(--pink);width:110px}
#tip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-shadow:0 0 6px #000;pointer-events:none}

#gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#3a1240 0%,var(--void) 70%);z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate .box{max-width:30rem;display:grid;gap:18px}
#gate h1{font-size:clamp(40px,9vw,76px);line-height:.9;margin:0;text-transform:uppercase;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan);text-wrap:balance}
#gate p{margin:0;color:var(--dim);font-family:var(--mono);font-size:13px;line-height:1.6}
#go{justify-self:start;font-size:15px;padding:14px 22px;background:var(--pink);color:#160812;border-color:var(--pink)}
#status{font-family:var(--mono);font-size:12px;color:#ffd84a;min-height:1.4em}
</style>
</head>
<body>
<div id="stage"><canvas id="out"></canvas></div>
<video id="cam" playsinline muted></video>
<div id="tip" hidden>Searching for eyes…</div>

<div id="rail" hidden>
  <button id="trigger" title="Tap for one episode, hold to keep it going (or hold space)">Hold / tap</button>
  <button id="lock" aria-pressed="false">Stay on</button>
  <button id="auto" aria-pressed="true">Auto</button>
  <button id="ink" aria-pressed="true">Ink lines</button>
  <label class="sl" for="copies">Copies <input id="copies" type="range" min="1" max="5" step="1" value="3"></label>
  <label class="sl" for="spacing">Spacing <input id="spacing" type="range" min="0.3" max="0.9" step="0.01" value="0.55"></label>
  <label class="sl" for="angle">Angle <input id="angle" type="range" min="-60" max="60" step="1" value="-25"></label>
  <label class="sl" for="crop">Crop <input id="crop" type="range" min="0" max="1" step="0.01" value="0.35"></label>
  <button id="snap">Photo</button>
  <button id="recBtn" aria-pressed="false">Record</button>
</div>

<div id="gate">
  <div class="box">
    <h1>Psycho Cam</h1>
    <p>Finds the exact outline of each eye, cuts out your real eye and chains overlapping copies of it outward, one after another. Nothing else in the picture changes.</p>
    <button id="go">Start camera</button>
    <div id="status"></div>
  </div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const out = $("#out"), ctx = out.getContext("2d");
const video = $("#cam");

// MediaPipe face-mesh indices: exact eye contour (16 pts), corners, iris
const EYES = [
  { contour:[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246], inner:133, outer:33 },
  { contour:[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466], inner:362, outer:263 },
];

let landmarker, W = 0, H = 0, sm = null, hasFace = false;
let copies = 3, crop = 0.35, auto = true, holding = false, lock = false, ink = true, spacing = 0.55, angleDeg = -25;
const mk = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d")]; };
const [base, bctx] = mk();
const eyeBuf = [mk(), mk()];
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- start ----------
$("#go").onclick = async () => {
  const st = $("#status"); $("#go").disabled = true;
  try {
    st.textContent = "Requesting camera…";
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} }, audio:false });
    video.srcObject = stream; await video.play();
    st.textContent = "Loading eye tracker…";
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = delegate => ({
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode:"VIDEO", numFaces:1,
    });
    try { landmarker = await FaceLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await FaceLandmarker.createFromOptions(files, opts("CPU")); }
    $("#gate").hidden = true; $("#rail").hidden = false; $("#tip").hidden = false;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    st.textContent = e.name === "NotAllowedError" ? "Camera access was blocked. Allow it in the address bar, then try again."
      : "Couldn't start: " + (e.message || e) + ". Use Chrome, Edge or Firefox with an internet connection.";
    $("#go").disabled = false;
  }
};

function resize(){
  const s = Math.min(1, 1280 / video.videoWidth);
  W = Math.round(video.videoWidth * s); H = Math.round(video.videoHeight * s);
  for (const c of [out, base]) { c.width = W; c.height = H; }
}

// ---------- controls ----------
const trig = $("#trigger");
const setHold = v => { holding = v; trig.classList.toggle("on", v); };
trig.addEventListener("pointerdown", e => { e.preventDefault(); setHold(true); });
for (const ev of ["pointerup","pointerleave","pointercancel"]) trig.addEventListener(ev, () => setHold(false));
addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); setHold(true); } });
addEventListener("keyup", e => { if (e.code === "Space") setHold(false); });
$("#auto").onclick = e => { auto = !auto; e.currentTarget.setAttribute("aria-pressed", auto); };
$("#copies").oninput = e => copies = +e.target.value;
$("#lock").onclick = e => { lock = !lock; e.currentTarget.setAttribute("aria-pressed", lock); };
$("#ink").onclick = e => { ink = !ink; e.currentTarget.setAttribute("aria-pressed", ink); };
$("#spacing").oninput = e => spacing = +e.target.value;
$("#angle").oninput = e => angleDeg = +e.target.value;
$("#crop").oninput = e => crop = +e.target.value;

function save(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("#snap").onclick = () => out.toBlob(b => save(b, `psycho-eyes-${Date.now()}.png`), "image/png");
let rec = null, chunks = [];
$("#recBtn").onclick = () => {
  const btn = $("#recBtn");
  if (rec) { rec.stop(); return; }
  const mimeType = ["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(out.captureStream(30), mimeType ? { mimeType, videoBitsPerSecond:6e6 } : {});
  chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const t = rec.mimeType || "video/webm"; save(new Blob(chunks, { type:t }), `psycho-eyes-${Date.now()}.${t.includes("mp4") ? "mp4" : "webm"}`); rec = null; btn.textContent = "Record"; btn.setAttribute("aria-pressed","false"); };
  rec.start(500); btn.textContent = "Stop"; btn.setAttribute("aria-pressed","true");
};

// ---------- episode timing ----------
// The chain unfolds one eye at a time on hard cuts, holds with a small "boil", then folds back.
let shown = 0, phase = "idle", phaseUntil = 0, nextAuto = performance.now() + 2500, nextBoil = 0, jit = [];
const STEP = () => rnd(55, 95);
const reroll = () => { jit = Array.from({ length: 8 }, () => ({ d: rnd(-.05, .05), a: rnd(-.1, .1), s: rnd(-.025, .025) })); };
reroll();
function tick(now){
  const want = holding || lock;
  if (want && (phase === "idle" || phase === "fold")) { phase = "unfold"; phaseUntil = now; }
  if (auto && phase === "idle" && now > nextAuto) { phase = "unfold"; phaseUntil = now; }
  if (now >= phaseUntil) {
    if (phase === "unfold") {
      if (shown < copies) { shown++; reroll(); phaseUntil = now + STEP(); }
      else { phase = "hold"; phaseUntil = now + rnd(800, 1500); }
    } else if (phase === "hold") {
      if (shown < copies) phase = "unfold";
      else if (!want) phase = "fold";
      else phaseUntil = now + 150;
    } else if (phase === "fold") {
      if (shown > 0) { shown--; reroll(); phaseUntil = now + STEP(); }
      else { phase = "idle"; nextAuto = now + rnd(2500, 6000); }
    }
  }
  if (shown > copies) shown = copies;
  if (shown && now > nextBoil) { reroll(); nextBoil = now + rnd(90, 170); }
}

// ---------- main loop ----------
function loop(now){
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (!W || Math.round(video.videoWidth * Math.min(1, 1280 / video.videoWidth)) !== W) resize();

  // mirrored camera frame, untouched
  bctx.setTransform(-1, 0, 0, 1, W, 0); bctx.drawImage(video, 0, 0, W, H); bctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(base, 0, 0);

  const res = landmarker.detectForVideo(video, now);
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  if (lm) {
    const fresh = !sm || !hasFace;
    if (fresh) sm = new Float32Array(lm.length * 2);
    for (let i = 0; i < lm.length; i++) {
      const x = (1 - lm[i].x) * W, y = lm[i].y * H;
      if (fresh) { sm[i*2] = x; sm[i*2+1] = y; } else { sm[i*2] += (x - sm[i*2]) * .65; sm[i*2+1] += (y - sm[i*2+1]) * .65; }
    }
    hasFace = true;
  } else hasFace = false;
  $("#tip").hidden = hasFace;

  if (!hasFace) return;
  tick(now);
  if (!shown) return;

  // cut out each eye along its real contour; real eye first, then the chain, outer copies on top
  for (let e = 0; e < 2; e++) {
    const f = cutEye(EYES[e], eyeBuf[e]);
    ctx.drawImage(f.cv, f.x0, f.y0);
    for (let k = 1; k <= shown; k++) stampChain(f, k);
  }
}

const P = i => [sm[i*2], sm[i*2+1]];

function cutEye(E, [cv, cx]){
  const I = P(E.inner), O = P(E.outer);
  const ew = Math.hypot(O[0] - I[0], O[1] - I[1]);
  const u = [(O[0] - I[0]) / ew, (O[1] - I[1]) / ew];
  let n = [-u[1], u[0]]; if (n[1] < 0) n = [-n[0], -n[1]];   // u: toward outer corner, n: toward chin
  const c = [(I[0] + O[0]) / 2, (I[1] + O[1]) / 2];
  // grow the contour in the eye's own axes: a bit wider, taller to catch the lid line and lashes
  const gx = 1.05 + crop * .25, gy = 1.25 + crop * 1.1;
  const pts = E.contour.map(i => {
    const p = P(i), dx = p[0] - c[0], dy = p[1] - c[1];
    const a = dx * u[0] + dy * u[1], b = dx * n[0] + dy * n[1];
    return [c[0] + u[0] * a * gx + n[0] * b * gy, c[1] + u[1] * a * gx + n[1] * b * gy];
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const pad = Math.ceil(ew * .08);
  x0 = Math.floor(x0 - pad); y0 = Math.floor(y0 - pad);
  const bw = Math.ceil(x1 - x0 + pad), bh = Math.ceil(y1 - y0 + pad);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; } else cx.clearRect(0, 0, bw, bh);

  // soft-edged mask from the smoothed contour
  cx.globalCompositeOperation = "source-over";
  cx.filter = `blur(${Math.max(.6, ew * .025).toFixed(1)}px)`;
  cx.beginPath();
  const q = pts.map(([x, y]) => [x - x0, y - y0]), m = q.length;
  cx.moveTo((q[m-1][0] + q[0][0]) / 2, (q[m-1][1] + q[0][1]) / 2);
  for (let i = 0; i < m; i++) { const a = q[i], b = q[(i + 1) % m]; cx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  cx.closePath(); cx.fillStyle = "#000"; cx.fill();
  cx.filter = "none";
  // your real eye pixels into the mask
  cx.globalCompositeOperation = "source-in";
  cx.drawImage(base, x0, y0, bw, bh, 0, 0, bw, bh);
  cx.globalCompositeOperation = "source-over";
  if (ink) {
    // anime lid line along the real (un-grown) contour; upper lid heavier
    const r = E.contour.map(i => { const p = P(i); return [p[0] - x0, p[1] - y0]; });
    const lw = Math.max(1.5, ew * 0.035);
    cx.lineJoin = cx.lineCap = "round"; cx.strokeStyle = "rgba(10,12,24,.9)";
    smoothPath(cx, r, true); cx.lineWidth = lw; cx.stroke();
    smoothPath(cx, [...r.slice(8), r[0]], false); cx.lineWidth = lw * 1.9; cx.stroke();
  }
  return { cv, x0, y0, c, u, n, ew };
}

function smoothPath(cx, q, closed){
  const m = q.length; cx.beginPath();
  if (closed) {
    cx.moveTo((q[m-1][0] + q[0][0]) / 2, (q[m-1][1] + q[0][1]) / 2);
    for (let i = 0; i < m; i++) { const a = q[i], b = q[(i + 1) % m]; cx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    cx.closePath();
  } else {
    cx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < m - 1; i++) { const a = q[i], b = q[i + 1]; cx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    cx.lineTo(q[m-1][0], q[m-1][1]);
  }
}

// copy k sits k steps along an arc leaving the outer corner; Angle tilts it up (-) or down (+)
function stampChain(f, k){
  let px = 0, py = 0;
  for (let i = 1; i <= k; i++) {
    const j = jit[i], a = angleDeg * Math.PI / 180 * (1 + (i - 1) * 0.35) + j.a, d = spacing * (1 + j.d);
    px += Math.cos(a) * d; py += Math.sin(a) * d;
  }
  const dx = (f.u[0] * px + f.n[0] * py) * f.ew, dy = (f.u[1] * px + f.n[1] * py) * f.ew;
  const sc = 1 - 0.04 * k + jit[k].s;
  ctx.save();
  ctx.translate(f.c[0] + dx, f.c[1] + dy); ctx.scale(sc, sc); ctx.translate(-f.c[0], -f.c[1]);
  ctx.drawImage(f.cv, f.x0, f.y0);
  ctx.restore();
}
</script>
</body>
</html>
